# GAOS, whole product, one exposed port. This is the LOCAL stack — it runs
# anywhere, needs no tunnel and no infrastructure.
#
#   http://localhost:8083/        landing-page (the marketing page — the site root)
#   http://localhost:8083/app/    Mission Control (/app stripped; /app redirects to /app/)
#   http://localhost:8083/docs/   pustaka       (/docs stripped; /docs redirects to /docs/)
#   http://localhost:8083/api/    the dashboard's JSON surface (/api stripped)
#
# ONE ORIGIN, ON PURPOSE. Same-origin means no CORS between the dashboard and
# anything else served here, and it is what lets the dashboard bake relative
# URLs everywhere instead of an absolute API base.
#
# NO DATABASE HERE. ArcadeDB belongs to the infra stack. With none reachable the
# dashboard still serves its fixtures and /api/healthz reports
# {"database":"unconfigured","ok":true} — that is the correct answer for this
# stack, not a degraded one. Point it at the host-published instance if you want
# the probe exercised:
#
#   GAOS_ARCADE_URL=http://host.docker.internal:9580 docker compose up -d
#
# 8083 rather than 8080: pustaka already holds 8080 on the development box, and
# a default that collides is a default nobody uses.

name: gaos

networks:
  gaos:
    name: gaos

services:
  # The ONLY service with a `ports:` mapping. Everything else is reachable
  # solely through it.
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      - "${GAOS_EDGE_PORT:-8083}:80"
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    # NO DOCKER SOCKET. Routing comes from dynamic.yml, not container labels --
    # see the provider note in traefik.yml. Access to that socket is root on the
    # host, and a public-facing proxy is the last thing that should hold it.
    networks: [gaos]

  # The site root. Static, and it owns the origin's 404 — see landing.conf.
  landing:
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    volumes:
      # Read-only, and served from the working tree: this is the local stack,
      # where serving whatever is checked out is the point. The deployed tiers
      # build an image instead.
      - ./landing-page:/srv/landing:ro
      - ./deploy/nginx/landing.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [gaos]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    restart: unless-stopped
    environment:
      GAOS_ADDR: ":8080"
      GAOS_ARCADE_URL: "${GAOS_ARCADE_URL:-}"
      GAOS_ARCADE_DB: "${GAOS_ARCADE_DB:-gaos}"
      GAOS_ARCADE_USER: "${GAOS_ARCADE_USER:-}"
      GAOS_ARCADE_PASSWORD: "${GAOS_ARCADE_PASSWORD:-}"
      # This stack is plain HTTP, so a Secure cookie would never be stored and
      # the back office could not be opened at all. Both deployed tiers set it
      # back to 1 — see the compose files under deploy/stacks.
      GAOS_COOKIE_SECURE: "0"
    # So the documented GAOS_ARCADE_URL above can actually name the host. The
    # deployed tiers do not need this -- they join the shared infra network and
    # reach ArcadeDB by container alias, with no host port involved at all.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [gaos]

  docs:
    build:
      context: ./pustaka
      dockerfile: ../deploy/Dockerfile.pustaka
    restart: unless-stopped
    networks: [gaos]
