<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cubiq">
  <title>Cubiq</title>
  <!-- Full-bleed field, --ink. Corners stay square: every platform applies its own mask. -->
  <rect width="512" height="512" fill="#16181D"/>
  <!-- 3x3 cube face. Palette matches the app's scan colours in index.html:
       U #FFD500 kuning · R #00A651 hijau · F #EE3124 merah · L #2F6FD6 biru · B #FF8200 jingga -->
  <g>
    <rect x="104" y="104" width="92" height="92" rx="14" fill="#FFD500"/>
    <rect x="210" y="104" width="92" height="92" rx="14" fill="#FFD500"/>
    <rect x="316" y="104" width="92" height="92" rx="14" fill="#EE3124"/>

    <rect x="104" y="210" width="92" height="92" rx="14" fill="#2F6FD6"/>
    <rect x="210" y="210" width="92" height="92" rx="14" fill="#FFD500"/>
    <rect x="316" y="210" width="92" height="92" rx="14" fill="#00A651"/>

    <rect x="104" y="316" width="92" height="92" rx="14" fill="#EE3124"/>
    <rect x="210" y="316" width="92" height="92" rx="14" fill="#FF8200"/>
    <rect x="316" y="316" width="92" height="92" rx="14" fill="#FFD500"/>
  </g>
</svg>
