# landing-page, served static. This container holds no application logic — the
# page is one HTML file, four stylesheets and three scripts.
#
# It owns the SITE ROOT, which makes it the 404 handler for the whole origin:
# anything that is not /app, /api or /docs lands here. That is why the fallback
# below is a real 404 and not an SPA rewrite — a typo'd docs URL must say "not
# found", not silently serve the marketing page with a 200.
#
# NO /sw.js BLOCK. Cubiq's landing page shipped a service-worker killswitch to
# unregister the PWA's old root-scoped worker. That file is not vendored here
# and this location is deliberately absent: the killswitch deletes EVERY cache
# on the origin unconditionally, and on a fresh origin it buys nothing while
# remaining a loaded gun aimed at whatever ships a worker here next.
server {
  listen 80;
  server_name _;
  root /srv/landing;
  index index.html;

  # Vendored fonts are versioned by content, never edited in place.
  location /vendor/ {
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Icons are small; a day is plenty.
  location /img/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # The page itself, its CSS and its scripts.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml;
  gzip_min_length 1024;
}
