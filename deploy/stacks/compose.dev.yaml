# GAOS DEVELOPMENT, behind the WireGuard tunnel.  Product slot 03 -> port 19301.
#
#   browser --HTTPS--> clino (the public edge, nginx terminates TLS)
#          --plain HTTP over WireGuard--> 10.10.0.2:19301 --> this Traefik
#
#   https://dev.gaos.mfardiansyah.id/       the landing page (site root)
#   https://dev.gaos.mfardiansyah.id/app/   Mission Control  ·  /docs/  ·  /api/
#
# Deliberately the same shape as compose.prod.yaml, differing ONLY in: the port,
# the compose project name, the internal subnet, the database name -- and, until
# prod runs one, the gateway block. Anything else that diverges is a bug. Read
# the prod file's comments first -- they are not repeated here.
#
# THE DEV DATABASE SHARES A SERVER WITH PROD (clinodb, since 2026-11-02) BUT NOT A
# DATABASE OR A USER: gaos_dev, read and written by user gaos_dev, which ArcadeDB
# refuses on gaos. A dev stack wired to the prod database would start cleanly,
# pass every smoke test and be invisible at runtime -- which is why
# deploy/check-stacks.sh asserts these two files never name each other's
# database.
#
#   docker compose -f deploy/stacks/compose.dev.yaml build
#   docker compose -f deploy/stacks/compose.dev.yaml up -d

name: gaos-dev

networks:
  internal:
    name: gaos-dev-int
    ipam:
      config:
        - subnet: 172.30.13.0/24

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    # Tunnel address only -- never 0.0.0.0. See compose.prod.yaml.
    ports:
      - "10.10.0.2:19301:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [internal]

  landing:
    build:
      context: ../../landing-page
      dockerfile: ../deploy/Dockerfile.landing
    restart: unless-stopped
    volumes:
      - ../nginx/landing.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    restart: unless-stopped
    env_file: [./dev.dashboard.env]
    environment:
      GAOS_ADDR: ":8080"
      # THE DATABASE IS ON clinodb, NOT ON THIS HOST (2026-11-02). One shared
      # ArcadeDB 26.7.2 (shared-infra on clinodb), reached over WireGuard through
      # gaos-arcade-bridge, which publishes on 10.10.0.5 only -- deploy/clinodb/.
      # The tiers are kept apart by DATABASE and by USER: dev is gaos_dev with
      # user gaos_dev, prod is gaos with user gaos_prod, and each user has rights
      # on its own database alone (a 403 on the other's). There is no infra
      # network to join any more; nothing here resolves a neighbour by name.
      GAOS_ARCADE_URL: "http://10.10.0.5:2480"
      GAOS_ARCADE_DB: "gaos_dev"
      # The graph store, not the fixtures. The binary applies the schema from
      # its embedded copy on boot -- idempotent, so a restart is a no-op -- and
      # REFUSES TO START if the database is unreachable. That is deliberate: a
      # dashboard asked for the graph store which quietly served fixtures would
      # look completely healthy while losing every write.
      GAOS_STORE: "arcadedb"
      GAOS_ARCADE_TENANT: "loop-eng"
      # "1" even in dev: this tier also sits behind real TLS at the edge.
      GAOS_COOKIE_SECURE: "1"
      # THE GATEWAY (D-055): model work goes to ai-manager on rnd-v2-vpn over
      # WireGuard, never to a tool in this image. The two secrets are FILES,
      # mounted read-only below from host-side files that are never committed
      # (deploy/stacks/*.aim-*, gitignored, mode 600). GAOS_RUNNER stays unset:
      # gateway mode means a turn CAN be sent; the runner is the permission to
      # spend, and it is an operator's decision per tier.
      GAOS_MODEL_MODE: "aimanager"
      GAOS_AIM_URL: "http://10.10.0.4:8099"
      GAOS_AIM_CHAT_AUTH_FILE: "/run/secrets/aim-chat.json"
      GAOS_AIM_ADMIN_KEY_FILE: "/run/secrets/aim-admin-key"
      GAOS_MODEL: "claude-sonnet-5"
    volumes:
      - ./dev.aim-chat.json:/run/secrets/aim-chat.json:ro
      - ./dev.aim-admin-key:/run/secrets/aim-admin-key:ro
    # The secrets are mode 600 and owned by the deploy user, so the container
    # runs as that uid (1001 on vm-rnd-ardi) rather than distroless's nonroot
    # 65532, which could not read them. Nothing else in the image is uid-bound.
    user: "1001:1001"
    networks: [internal]

  docs:
    build:
      context: ../../pustaka
      dockerfile: ../deploy/Dockerfile.pustaka
    restart: unless-stopped
    env_file: [./dev.docs.env]
    # Same bounds as prod (D-094): dev is retired, but if it ever runs it is
    # public through the edge and shares the VM with every product.
    mem_limit: 256m
    cpus: 0.5
    networks: [internal]
