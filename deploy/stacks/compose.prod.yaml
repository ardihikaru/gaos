# GAOS PRODUCTION, behind the WireGuard tunnel.  Product slot 03 -> port 18301.
#
#   browser --HTTPS--> clino (EDGE_IP, nginx terminates TLS)
#          --plain HTTP over WireGuard--> 10.10.0.2:18301 --> this Traefik
#
#   https://gaos.mfardiansyah.id/       the landing page (site root)
#   https://gaos.mfardiansyah.id/app/   Mission Control  ·  /docs/  ·  /api/
#
# compose.dev.yaml is deliberately the same shape, differing ONLY in: the port,
# the hostname, the compose project name, the internal subnet and the database
# name (gaos here, gaos_dev there, on one shared server) -- and the gateway block,
# which dev runs first. A difference outside that list is a bug rather than a
# decision, and deploy/check-stacks.sh asserts the ones that matter.
#
#   docker compose -f deploy/stacks/compose.prod.yaml build
#   docker compose -f deploy/stacks/compose.prod.yaml up -d

name: gaos-prod

networks:
  internal:
    name: gaos-prod-int
    # PINNED. The subnet has to be nameable to reason about traefik.yml's
    # trustedIPs, and an unpinned bridge takes whatever 172.x is free that day.
    # 172.30.10/11 belong to the neighbouring product; .12 and .13 are ours.
    ipam:
      config:
        - subnet: 172.30.12.0/24


services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      # THE TUNNEL ADDRESS PREFIX IS LOAD-BEARING. Without "10.10.0.2:" this
      # publishes on every interface the host has -- the LAN and the
      # site-to-site link included -- and nothing about that is visible in
      # `docker compose ps`. Check it with `ss -ltnp` after every change.
      # GAOS_TUNNEL_IP defaults to 10.10.0.2 (vm-rnd-ardi). A second instance on
      # another VM sets it to that VM's own wg address (rnd-v3-vpn: 10.10.0.9).
      - "${GAOS_TUNNEL_IP:-10.10.0.2}:18301:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [internal]

  landing:
    build:
      context: ../../landing-page
      dockerfile: ../deploy/Dockerfile.landing
    restart: unless-stopped
    volumes:
      # The server block stays a bind mount in every tier, the same file the
      # local compose uses, so cache headers live in exactly one place.
      - ../nginx/landing.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: ../deploy/Dockerfile.dashboard
    restart: unless-stopped
    env_file: [./prod.dashboard.env]
    environment:
      GAOS_ADDR: ":8080"
      # THE DATABASE IS ON clinodb, NOT ON THIS HOST (2026-11-02). One shared
      # ArcadeDB 26.7.2 (shared-infra on clinodb), reached over WireGuard through
      # gaos-arcade-bridge, which publishes on 10.10.0.5 only -- deploy/clinodb/.
      # The tiers are kept apart by DATABASE and by USER: dev is gaos_dev with
      # user gaos_dev, prod is gaos with user gaos_prod, and each user has rights
      # on its own database alone (a 403 on the other's). There is no infra
      # network to join any more; nothing here resolves a neighbour by name.
      # Default: the shared ArcadeDB on clinodb. The rnd-v3-vpn instance points
      # GAOS_ARCADE_URL at the ArcadeDB on rnd-v2-vpn (http://10.10.0.4:9480).
      GAOS_ARCADE_URL: "${GAOS_ARCADE_URL:-http://10.10.0.5:2480}"
      # Default `gaos`. The second instance (rnd-v3-vpn) sets GAOS_ARCADE_DB to
      # its own database, so the two never share a graph.
      GAOS_ARCADE_DB: "${GAOS_ARCADE_DB:-gaos}"
      # The graph store, not the fixtures. The binary applies the schema from
      # its embedded copy on boot -- idempotent, so a restart is a no-op -- and
      # REFUSES TO START if the database is unreachable. That is deliberate: a
      # dashboard asked for the graph store which quietly served fixtures would
      # look completely healthy while losing every write.
      GAOS_STORE: "arcadedb"
      GAOS_ARCADE_TENANT: "loop-eng"
      # "1" IN BOTH TIERS, and this is not a copy-paste slip: the browser
      # reaches both over real TLS at the edge, so the session cookie must keep
      # its Secure flag. The flag is env-driven, never scheme-derived, because
      # these containers only ever see plain HTTP inside the tunnel.
      GAOS_COOKIE_SECURE: "1"
      # THE GATEWAY (D-055): model work goes to ai-manager on rnd-v2-vpn over
      # WireGuard, never to a tool in this image. Since v0.33.1 prod is the only
      # tier -- dev was retired on 2026-11-03 -- so it carries what dev did. The
      # two secrets are FILES, mounted read-only below from host-side files
      # that are never committed (deploy/stacks/*.aim-*, gitignored, mode 600).
      # Gateway mode means a turn CAN be sent; the runner below is the
      # permission to spend, and it is an operator's decision.
      GAOS_MODEL_MODE: "aimanager"
      # THE RUNNER (D-080, BR-56): the permission to spend. Empty/unset = off:
      # nothing is ever dispatched. "manual" = the scheduler readies work and only
      # a board move ready -> working sends a turn, one chosen card at a time.
      # "on" = the scheduler dispatches everything ready, unasked. Read from the
      # deploying shell, so it must be on EVERY redeploy line; a plain redeploy
      # falls back to off. This key overrides a GAOS_RUNNER in prod.dashboard.env.
      GAOS_RUNNER: "${GAOS_RUNNER:-}"
      GAOS_AIM_URL: "http://10.10.0.4:8099"
      GAOS_AIM_CHAT_AUTH_FILE: "/run/secrets/aim-chat.json"
      GAOS_AIM_ADMIN_KEY_FILE: "/run/secrets/aim-admin-key"
      GAOS_MODEL: "claude-sonnet-5"
      # THE MACHINE API (D-072, BR-52). Three bearer tokens, each a FILE holding
      # gaos_<hex>, mounted read-only below from host-side files that are never
      # committed (deploy/stacks/prod.api-*, gitignored, mode 600). They MUST
      # EXIST before `up`: a missing bind-mount source is created by Docker as a
      # root-owned directory, and the dashboard would then read a directory. An
      # EMPTY file is the way to leave a token unset (the API fails closed: 503
      # until a token is set), and a token is read at boot, so a change needs a
      # restart. Admin: seed, catalog import. QA: the QA tools' routes. Out: what
      # GAOS presents when IT calls the QA tools (empty until they implement
      # their side). The three must differ or the API disables itself.
      GAOS_API_ADMIN_TOKEN_FILE: "/run/secrets/api-admin"
      GAOS_API_QA_TOKEN_FILE: "/run/secrets/api-qa"
      GAOS_QA_TOKEN_FILE: "/run/secrets/api-qa-out"
      # D-079: back-office sign-in. The accounts file and the session key are
      # host-side secrets (deploy/stacks/prod.bo-*, gitignored, mode 600). The
      # label binds a session to this deployment; with it empty, prod disables
      # sign-in rather than guess.
      GAOS_BO_USERS_FILE: "/run/secrets/bo-users"
      GAOS_BO_SESSION_KEY_FILE: "/run/secrets/bo-session-key"
      GAOS_BO_LABEL: "${GAOS_BO_LABEL:-}"
      # Which products the QA token may reach: PRODUCT IDS (p-6), comma
      # separated. Unset reaches nothing. The id is known after the seed prints it.
      GAOS_API_QA_PRODUCTS: "${GAOS_API_QA_PRODUCTS:-}"
      # The QA tools' base URL for the two sync buttons; empty = buttons off.
      GAOS_QA_URL: "${GAOS_QA_URL:-}"
    volumes:
      - ./prod.aim-chat.json:/run/secrets/aim-chat.json:ro
      - ./prod.aim-admin-key:/run/secrets/aim-admin-key:ro
      - ./prod.api-admin:/run/secrets/api-admin:ro
      - ./prod.api-qa:/run/secrets/api-qa:ro
      - ./prod.api-qa-out:/run/secrets/api-qa-out:ro
      - ./prod.bo-users:/run/secrets/bo-users:ro
      - ./prod.bo-session-key:/run/secrets/bo-session-key:ro
    # The secrets are mode 600 and owned by the deploy user, so the container
    # runs as that uid (1001 on vm-rnd-ardi) rather than distroless's nonroot
    # 65532, which could not read them. Nothing else in the image is uid-bound.
    # GAOS_UID / GAOS_GID override it for a host whose deploy user differs
    # (rnd-v3-vpn: 1000).
    user: "${GAOS_UID:-1001}:${GAOS_GID:-1001}"
    # No service joins an infra network: the database is an address on the
    # tunnel, and least privilege as topology is now simply "nobody resolves a
    # neighbour's services by name".
    networks: [internal]

  docs:
    build:
      context: ../../pustaka
      dockerfile: ../deploy/Dockerfile.pustaka
    restart: unless-stopped
    # The login layer. It survives the /docs strip because pustaka reads the
    # X-Forwarded-Prefix that strip sets -- see ../traefik/dynamic.yml. It
    # guards everything including the docs home; only the login routes and the
    # login page's own stylesheets are public, and /, /app and /api are other
    # services entirely. Names in docs.env.example.
    #
    # env_file, not ${...} interpolation: no flag to forget, and a missing file
    # is a hard error rather than a silently empty password.
    env_file: [./prod.docs.env]
    networks: [internal]
