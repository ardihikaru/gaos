# GAOS — edge L7 on clino. TLS ends HERE; plain HTTP over WireGuard onwards.
#
# Install as /etc/nginx/conf.d/gaos.conf. Do not apply this without reading
# deploy/edge/README.md first — three of the rules below have already cost
# somebody an outage on this box.
#
# FOUR THINGS THAT WILL BREAK EVERY PRODUCT ON THE HOST IF IGNORED:
#
# 1. `map` VARIABLE NAMES ARE GLOBAL INSIDE http{}. cubiq.conf already defines
#    $connection_upgrade, and clino.conf had to rename its own to
#    $clino_connection_upgrade after a collision. Every variable here is
#    $gaos_-prefixed. A duplicate name makes nginx REFUSE TO START, which takes
#    clino.id, cubiq.mfardiansyah.id and this down together.
#
# 2. `nginx -t` BEFORE `systemctl reload`. Always. No exceptions.
#
# 3. NO default_server ON :443. conf.d loads alphabetically; clino.conf is the
#    implicit default and answers unknown Hosts with 444. gaos.conf sorts
#    between clino.conf and cubiq.conf — harmless. Do not "fix" it.
#
# 4. NEVER FORWARD /.well-known/acme-challenge/. It is answered locally from
#    /var/www/acme. Proxy it and renewal dies silently in about sixty days,
#    which is long enough that nobody connects the change to the outage.
#
# The edge runs nginx.org stable (1.30+), so HTTP/2 is the `http2 on;` directive inside each
# TLS server block. The old `listen 443 ssl http2;` parameter is deprecated; do not use it.

server {
    listen 80;
    listen [::]:80;
    server_name gaos.mfardiansyah.id dev.gaos.mfardiansyah.id;

    # ACME HTTP-01. Answered HERE, never forwarded — certificates are managed at
    # the edge, not on the private side. See rule 4 above.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

map $http_upgrade $gaos_connection_upgrade { default upgrade; '' close; }

# Rate limits for the public docs (D-096). The docs are readable by anyone, and
# the docs server reads and searches on every request, so one client must not
# be able to keep it busy. Every key is empty outside /docs, and nginx does not
# count a request whose key is empty: /, /app and /api are unaffected.
#
# One client = one IPv4 address, or one IPv6 /64 (a host is usually handed a
# whole /64, so keying by address would let it rotate freely). A compressed
# IPv6 address whose /64 is not spelled out in full falls back to the address.
# The page zone excludes /docs/__pustaka/, so an API call is charged once. A
# page view is about fifteen requests (HTML, CSS, JS, fonts, eight ToC parts):
# bursts of 60. The API (search, the index, partial navigation) gets 5 r/s per
# client and 50 r/s in total, and a client may hold 20 connections to /docs.
# Zone and map names are global on this box: a second instance's file reuses
# them and never redefines them.
map $remote_addr $gaos_client_key {
    "~^(?<net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $net;
    default $binary_remote_addr;
}
map $uri $gaos_docs_api_key  { ~^/docs/__pustaka/ $gaos_client_key; default ""; }
map $uri $gaos_docs_all_key  { ~^/docs/__pustaka/ docs;              default ""; }
map $uri $gaos_docs_page_key { ~^/docs/__pustaka/ ""; ~^/docs(/|$) $gaos_client_key; default ""; }
map $uri $gaos_docs_conn_key { ~^/docs(/|$) $gaos_client_key; default ""; }
limit_req_zone  $gaos_docs_api_key  zone=gaos_docs_api:10m  rate=5r/s;
limit_req_zone  $gaos_docs_all_key  zone=gaos_docs_all:1m   rate=50r/s;
limit_req_zone  $gaos_docs_page_key zone=gaos_docs_page:10m rate=20r/s;
limit_conn_zone $gaos_docs_conn_key zone=gaos_docs_conn:10m;

# Host -> tunnel port. Digits: 1<env><product>1 — 18xx1 prod, 19xx1 non-prod.
# GAOS holds product slot 03. An unknown Host is answered with 444: close the
# connection without speaking, and leak nothing about what else lives here.
map $host $gaos_backend {
    hostnames;
    dev.gaos.mfardiansyah.id   10.10.0.2:19301;
    gaos.mfardiansyah.id       10.10.0.2:18301;
    default                    "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gaos.mfardiansyah.id;

    # TWO CERTIFICATE LINEAGES, not one combined certificate.
    #
    # HTTP-01 fails all-or-nothing: one hostname that stops resolving aborts the
    # renewal of every SAN on the same certificate. Splitting them means a
    # broken dev DNS record cannot take production's certificate down with it.
    # This mirrors the clino / clino-dev split already on this box.
    ssl_certificate     /etc/letsencrypt/live/gaos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaos/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;

    if ($gaos_backend = "") { return 444; }

    location / {
        # http, NOT https: inside the tunnel everything is plain — WireGuard is
        # the encryption. A second TLS layer buys nothing and costs a handshake.
        proxy_pass http://$gaos_backend;
        limit_req zone=gaos_docs_api  burst=20  nodelay;
        limit_req zone=gaos_docs_all  burst=100 nodelay;
        limit_req zone=gaos_docs_page burst=60  nodelay;
        limit_req_status 429;
        limit_conn gaos_docs_conn 20;
        limit_conn_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # APPEND, not overwrite. Nothing behind this reads only the first hop,
        # and appending preserves whatever a legitimate upstream proxy recorded.
        # (clino.conf deliberately OVERWRITES for its own product, because that
        # application reads the first XFF entry and an appendable header would
        # let a caller mint their own rate-limit bucket. Different answer, same
        # question — pick deliberately, and write down why.)
        #
        # Traefik downstream believes this header only from 10.10.0.0/24. Get
        # that list wrong and every caller on earth collapses into one value
        # while the whole stack looks healthy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gaos_connection_upgrade;
        # Mission Control polls on a timer today and will hold an SSE stream
        # tomorrow. 300s is what the neighbouring product uses.
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.gaos.mfardiansyah.id;

    ssl_certificate     /etc/letsencrypt/live/gaos-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaos-dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;

    if ($gaos_backend = "") { return 444; }

    location / {
        proxy_pass http://$gaos_backend;
        limit_req zone=gaos_docs_api  burst=20  nodelay;
        limit_req zone=gaos_docs_all  burst=100 nodelay;
        limit_req zone=gaos_docs_page burst=60  nodelay;
        limit_req_status 429;
        limit_conn gaos_docs_conn 20;
        limit_conn_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gaos_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# A second instance on this edge keeps its own :80 and :443 blocks in a
# separate file made from deploy/edge/instance.conf.example and installed
# beside this one as conf.d/gaos-<label>.conf (D-085). It proxies to its
# tunnel address directly and adds nothing to the map above.
